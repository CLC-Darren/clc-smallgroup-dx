<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>CLC Small Group | 世界</title>
  <script>try{var t=localStorage.getItem('sg_theme');if(t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.classList.add('dark')}catch(e){}</script>
  <link rel="stylesheet" href="css/sg-roster.css?v=20261116e">
  <link rel="stylesheet" href="css/sg-app.css?v=20261116e">
</head>
<body data-page="world" data-roles="district,leader,member">
  <main class="sg-main sg-main-world">
    <div class="sg-appbar" id="sgAppbar"><div style="flex:1;min-width:0"><p class="sg-hello" id="hello">Hello</p><p class="sg-verse" id="verse"></p></div></div>
    <div class="sg-world">
      <section class="sg-world-map" aria-label="世界地圖（示意圖）">
        <svg id="world" viewBox="440 60 460 560" preserveAspectRatio="xMidYMid slice" role="img" aria-label="保羅第一次宣教路線示意圖"></svg>
        <span class="sg-demo-tag">示意圖・正式版換成繪製的地圖</span>
        <span class="sg-map-chip" id="mapCity"></span>
      </section>
      <section class="sg-world-feed" aria-label="動態">
        <div class="sg-grab" aria-hidden="true"></div>
        <section class="sg-card hidden" id="leadCard"></section>
        <div id="sideSlotMobile" class="sg-stack"></div>
        <section class="sg-card"><div class="sg-compose"><span id="meAvatar"></span><button type="button" class="fake" data-compose="mood">分享點什麼…</button></div>
          <div class="sg-compose-types"><button type="button" data-compose="testimony">✨ 見證</button><button type="button" data-compose="prayer">🙏 代禱</button><button type="button" data-compose="qt">📖 QT</button><button type="button" data-compose="gift">🎁 送卡</button></div></section>
        <div style="display:flex;align-items:center;gap:8px"><div class="sg-chipbar" id="feedFilter" style="flex:1"></div><a class="sg-more" href="fellowship.html" style="white-space:nowrap;font-size:13px;font-weight:700;color:var(--sg-teal-text);text-decoration:none;padding-bottom:10px">代禱・見證 ›</a></div>
        <div class="sg-stack" id="feed"></div>
        <aside id="sideCol" class="hidden"></aside>
      </section>
    </div>
  </main>
  <script src="js/sg-seed-static.js?v=20261116e"></script>
  <script src="js/sg-mock-data.js?v=20261116e"></script>
  <script src="js/sg-mockdb.js?v=20261116e"></script>
  <script src="js/sg-shell.js?v=20261116e"></script>
  <script src="js/sg-data.js?v=20261116e"></script>
  <script src="js/sg-mapdemo.js?v=20261116e"></script>
  <script src="js/sg-feed.js?v=20261116e"></script>
  <script src="js/sg-home.js?v=20261116e"></script>
</body>
</html>
