<!DOCTYPE html>
<html lang="zh-TW" class="sr-members">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>CLC Small Group | 新朋友名單</title>
  <script>try{var t=localStorage.getItem('sg_theme');if(t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.classList.add('dark')}catch(e){}</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['"CLC Arial"','Arial','"Microsoft JhengHei"','sans-serif']}}}};</script>
  <link rel="stylesheet" href="css/sg-roster.css?v=20261116r">
  <link rel="stylesheet" href="css/sg-app.css?v=20261116r">
</head>
<body class="min-h-screen" data-mode="intakes" data-page="care" data-roles="district,leader">
  <main class="sg-main">
  <div class="sg-appbar" id="sgAppbar"><h1><a href="care.html#intake" style="color:inherit;text-decoration:none">‹</a> 新朋友名單</h1></div>
  <div class="max-w-[1500px] px-4 lg:px-6 pb-6">
    <!-- 靜態階段沒有登入；保留這兩個區塊給名單程式使用 -->
    <section id="gateChecking" class="hidden" role="status">讀取中…</section>
    <section id="gateLogin" class="hidden"></section>

    <section id="app" class="hidden">
      <!-- 工具列：電腦一排、手機分行 -->
      <div class="flex flex-col lg:flex-row lg:items-center gap-3 mb-4">
        <div class="flex items-center justify-between lg:justify-start gap-3">
          <div>
            <p id="countLine" class="sg-count text-sm lg:hidden" role="status" aria-live="polite"></p>
          </div>
          <div class="flex gap-2 lg:hidden">
            <button type="button" class="m-round sg-plain" data-export aria-label="下載 PDF 或 JPG"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg></button>
            <button type="button" class="m-round admin-only bg-[#007E8A] text-white" data-new aria-label="新增新朋友"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
            <div class="relative hidden"><a id="pageMenuGear" href="me.html" class="m-round sg-plain" aria-label="更多設定"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a></div>
          </div>
        </div>

        <!-- 電腦版篩選（小組、狀態在表頭點選） -->
        <div class="hidden lg:flex flex-nowrap items-center gap-2 flex-1 min-w-0">
          <button type="button" class="m-btn m-dark-btn" data-export aria-haspopup="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg>下載</button>
          <span class="flex-1"></span>
          <label class="m-search" style="flex:0 1 300px;min-width:150px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="flex:none"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="sr-only">搜尋</span><input type="search" data-q placeholder="搜尋姓名、電話、編號"></label>
          <button type="button" class="m-btn m-btn-teal admin-only" data-new>＋ 新增</button>
          <div class="relative" id="gearDesktopSlot"></div>
        </div>

        <!-- 手機版篩選 -->
        <div class="lg:hidden flex flex-col gap-3">
          <label class="m-search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="sr-only">搜尋</span><input type="search" data-q placeholder="搜尋姓名或電話"></label>
          <div class="grid grid-cols-2 gap-2">
            <label><span class="sr-only">小組</span><select class="m-dark-field w-full" data-filter="group"></select></label>
            <label><span class="sr-only">狀態</span><select class="m-dark-field w-full" data-filter="status"></select></label>
          </div>
        </div>
      </div>

      <!-- 電腦版：表格＋右側個人資料 -->
      <div class="hidden lg:flex gap-4 items-start" id="deskWrap">
        <section aria-label="名單" class="flex-1 min-w-0 bg-white rounded-[14px] overflow-hidden flex flex-col" style="height: calc(100vh - 160px)">
          <div class="flex-1 overflow-auto">
            <table class="m-table">
              <colgroup><col style="width:20%"><col style="width:14%"><col style="width:11%"><col style="width:15%"><col style="width:15%"><col style="width:13%"><col style="width:12%"></colgroup>
              <thead><tr><th><button type="button" class="m-th" data-col="sortName"></button></th><th>性別</th><th><button type="button" class="m-th" data-col="sortBirth"></button></th><th>手機</th><th><button type="button" class="m-th" data-col="group"></button></th><th><button type="button" class="m-th" data-col="status"></button></th><th>名冊</th></tr></thead>
              <tbody id="tbody"></tbody>
            </table>
            <p id="tableEmpty" class="hidden text-center text-[#6E6E73] py-16"></p>
          </div>
          <div id="tableFoot" class="px-4 py-2.5 border-t border-[#EFEFF4] text-[13px] text-[#6E6E73]"></div>
        </section>
        <aside id="inspector" aria-label="個人資料" class="m-light hidden w-[380px] flex-none bg-[#F2F2F7] rounded-[14px] p-4 overflow-y-auto" style="height: calc(100vh - 160px)"></aside>
      </div>

      <!-- 手機版：卡片 -->
      <div id="cards" class="lg:hidden grid gap-2.5 sm:grid-cols-2"></div>
      <p id="cardsEmpty" class="lg:hidden hidden text-center sg-count py-12"></p>
    </section>
  </div>
  </main>
  <div id="colMenu" class="m-colmenu hidden" role="menu"></div>

  <!-- 手機：個人資料頁 -->
  <div id="sheet" class="m-sheet hidden" role="dialog" aria-modal="true" aria-label="個人資料">
    <div class="m-sheet-bar">
      <button type="button" class="m-link" data-close><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>新朋友名單</button>
      <button type="button" class="m-link admin-only" id="sheetEdit">編輯</button>
    </div>
    <div id="sheetBody" class="m-light px-4 pb-10 max-w-xl mx-auto"></div>
  </div>

  <input type="file" id="photoInput" accept="image/*" class="hidden">

  <script src="js/sg-seed-static.js?v=20261116r"></script>
  <script src="js/sg-mock-data.js?v=20261116r"></script>
  <script src="js/sg-mockdb.js?v=20261116r"></script>
  <script src="js/sg-shell.js?v=20261116r"></script>
  <script src="js/sg-data.js?v=20261116r"></script>
  <script src="js/sg-feed.js?v=20261116r"></script>
  <script src="js/sg-frame.js?v=20261116r"></script>
  <script src="js/sg-export.js?v=20261116r"></script>
  <script src="js/sg-roster.js?v=20261116r"></script>
</body>
</html>
