<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>漢威牧區管理 | 更多</title>
  <script>try{var t=localStorage.getItem('sg_theme');if(t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.classList.add('dark')}catch(e){}</script>
  <link rel="stylesheet" href="css/sg-app.css?v=20261116a">
</head>
<body data-page="more">
  <main class="sg-main"><div class="sg-wrap">
    <h1 class="sg-title">更多</h1>
    <p class="sg-sub">其他功能、外觀與後台。</p>
    <section class="sg-card"><h2>其他功能</h2>
      <div class="sg-item"><span class="sg-ic" aria-hidden="true">🎸</span><span class="sg-txt">服事團隊<small>各服事崗位的同工名單</small></span><span class="sg-badge">第 2 批</span></div>
      <div class="sg-item"><span class="sg-ic" aria-hidden="true">💰</span><span class="sg-txt">小組基金與請款<small>收支明細、請款申請與追蹤</small></span><span class="sg-badge">第 3 批</span></div>
      <div class="sg-item"><span class="sg-ic" aria-hidden="true">👤</span><span class="sg-txt">我的資料<small>姓名、生日、服事崗位</small></span><span class="sg-badge">第 3 批</span></div>
    </section>
    <section class="sg-card"><h2>外觀</h2>
      <div class="sg-item"><span class="sg-ic" aria-hidden="true">🌓</span><span class="sg-txt">深淺色</span>
        <div class="sg-seg" id="themeSeg" role="group" aria-label="深淺色"><button type="button" data-t="">跟隨系統</button><button type="button" data-t="light">淺色</button><button type="button" data-t="dark">深色</button></div></div>
    </section>
    <section class="sg-card"><h2>後台（區長）</h2>
      <div class="sg-item"><span class="sg-ic" aria-hidden="true">🗂️</span><span class="sg-txt">小組維護<small>新增、停用、分植紀錄</small></span><span class="sg-badge">第 4 批</span></div>
      <div class="sg-item"><span class="sg-ic" aria-hidden="true">🏷️</span><span class="sg-txt">選項與課程清單<small>聚會狀態、服事崗位、課程項目</small></span><span class="sg-badge">第 4 批</span></div>
      <div class="sg-item"><span class="sg-ic" aria-hidden="true">🔑</span><span class="sg-txt">角色與功能<small>小組長能看、能改哪些功能</small></span><span class="sg-badge">第 4 批</span></div>
      <div class="sg-item"><span class="sg-ic" aria-hidden="true">📦</span><span class="sg-txt">匯出／匯入全部資料<small>搬家、備份用</small></span><span class="sg-badge">第 4 批</span></div>
    </section>
    <section class="sg-card"><h2>靜態預覽</h2>
      <div class="sg-item"><span class="sg-ic" aria-hidden="true">🧪</span><span class="sg-txt">重設假資料<small>你在名冊裡的修改只存在這台裝置的瀏覽器；按這裡回到初始假資料。</small></span>
        <button type="button" class="sg-btn sg-btn-red" id="resetMock">重設</button></div>
    </section>

  </div></main>
  <script src="js/sg-shell.js?v=20261116a"></script>
  <script src="js/sg-mock-data.js?v=20261116a"></script>
  <script src="js/sg-mockdb.js?v=20261116a"></script>
  <script>
    (function () {
      const seg = document.getElementById('themeSeg');
      const paint = () => seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === SG_SHELL.getTheme())));
      seg.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { SG_SHELL.setTheme(b.dataset.t); paint(); } });
      paint();
      document.getElementById('resetMock').addEventListener('click', () => { if (confirm('回到初始假資料？剛剛在名冊裡的修改會清掉。')) SG_MOCK.reset(); });
    })();
  </script>
</body>
</html>
