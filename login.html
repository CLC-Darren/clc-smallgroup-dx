<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>CLC Small Group | 登入</title>
  <script>try{var t=localStorage.getItem('sg_theme');if(t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.classList.add('dark')}catch(e){}</script>
  <link rel="stylesheet" href="css/sg-roster.css?v=20261116o">
  <link rel="stylesheet" href="css/sg-app.css?v=20261116o">
  <style>
    .lg-wrap { max-width: 400px; margin: 0 auto; padding: 32px 16px 40px; }
    .lg-logo { width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg, #007E8A, #2DB3BE); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 34px; margin: 0 auto 14px; box-shadow: 0 10px 30px rgba(0,126,138,.35); }
    .lg-btn { width: 100%; min-height: 50px; border-radius: 12px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; border: 1px solid var(--sg-line); background: var(--sg-card); color: var(--sg-text); }
    .lg-or { display: flex; align-items: center; gap: 10px; color: var(--sg-muted); font-size: 13px; margin: 18px 0; }
    .lg-or::before, .lg-or::after { content: ''; flex: 1; height: 1px; background: var(--sg-line); }
  </style>
</head>
<body data-page="login">
  <main class="lg-wrap">
    <div class="lg-logo" aria-hidden="true">⛪</div>
    <h1 style="text-align:center;font-size:24px;font-weight:800;margin:0">漢威牧區</h1>
    <p style="text-align:center;color:var(--sg-muted);margin:6px 0 24px;font-size:14px">一起建造生命、彼此關心</p>

    <section class="sg-card"><div class="sg-card-b" style="padding:18px 16px">
      <button type="button" class="lg-btn" id="gBtn"><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>用 Google 帳號登入</button>
      <div class="lg-or">沒有 Google 帳號</div>
      <form id="eForm" novalidate>
        <label class="sg-lab" for="eMail" style="margin-top:0">Email</label><input class="sg-in" id="eMail" type="email" autocomplete="username" placeholder="name@example.com">
        <label class="sg-lab" for="ePw">密碼</label><input class="sg-in" id="ePw" type="password" autocomplete="current-password">
        <button type="submit" class="sg-btn sg-btn-teal" style="width:100%;min-height:48px;margin-top:14px">登入</button>
        <div style="display:flex;justify-content:space-between;margin-top:10px;font-size:13px"><button type="button" class="sg-more" style="background:none;border:0;color:var(--sg-teal-text);font-weight:700;cursor:pointer" id="forgot">忘記密碼</button><span style="color:var(--sg-muted)">帳號由小組長幫你開</span></div>
      </form>
    </div></section>

    <section class="sg-card" style="margin-top:18px;border:1px dashed #E8A33D"><div class="sg-card-h" style="color:#A0640A">🧪 預覽身分（暫時）</div>
      <div class="sg-card-b"><p class="sg-note" style="margin:0 0 10px">靜態預覽還沒有接上真正的登入。用下面的按鈕選一個身分進去看看；正式版會拿掉這一區。</p>
      <div id="demo" class="sg-stack"></div></div></section>
  </main>
  <script src="js/sg-seed-static.js?v=20261116o"></script>
  <script src="js/sg-mock-data.js?v=20261116o"></script>
  <script src="js/sg-mockdb.js?v=20261116o"></script>
  <script src="js/sg-shell.js?v=20261116o"></script>
  <script src="js/sg-data.js?v=20261116o"></script>
  <script>
    (function () {
      const U = window.SGU;
      if (U.getSession()) { location.replace('index.html'); return; }
      const go = d => { U.setSession({ personId: d.personId, role: d.role }); location.replace('index.html'); };
      U.$('demo').innerHTML = U.DEMO.map((d, i) => `<button type="button" class="lg-btn" data-i="${i}">${U.esc(d.label)}</button>`).join('');
      U.$('demo').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) go(U.DEMO[+b.dataset.i]); });
      const notYet = () => U.toast('靜態預覽還沒接上真正的登入，請用下面的「預覽身分」');
      U.$('gBtn').addEventListener('click', notYet);
      U.$('eForm').addEventListener('submit', e => { e.preventDefault(); notYet(); });
      U.$('forgot').addEventListener('click', () => U.toast('正式版會寄重設密碼信到你的 Email'));
    })();
  </script>
</body>
</html>
