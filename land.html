<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>CLC Small Group | 我的領地</title>
  <script>try{var t=localStorage.getItem('sg_theme');if(t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.classList.add('dark')}catch(e){}</script>
  <link rel="stylesheet" href="css/sg-roster.css?v=20261116w">
  <link rel="stylesheet" href="css/sg-app.css?v=20261116w">

<body data-page="land" data-roles="district,leader,member">
  <main class="sg-main sg-main-world">
    <div class="sg-appbar" id="sgAppbar"><h1>我的領地</h1></div>
    <div class="sg-world">
      <section class="sg-world-map sg-land3d" id="land3d" aria-label="我的領地（3D 小島，可拖曳、縮放）">
        <span class="sg-demo-tag">小島試作・可拖曳、縮放</span>
      </section>
      <section class="sg-world-feed" aria-label="我的進度">
        <div class="sg-grab" aria-hidden="true"></div>
        <section class="sg-card"><div class="sg-card-b" style="display:flex;align-items:center;gap:12px;padding-top:14px"><span id="meAv"></span><div style="flex:1;min-width:0"><div id="meName" style="font-size:17px;font-weight:800"></div><div id="meSub" class="sg-note"></div></div>
          <span class="sg-badge" title="Q 版英雄角色下一階段加入">英雄角色：即將推出</span></div></section>
        <section class="sg-card" id="landTasks"></section>
        <section class="sg-card" id="landArmor"></section>
        <section class="sg-card" id="landBible"></section>
        <section class="sg-card"><div class="sg-card-h">我的收藏</div>
          <a class="sg-item" href="me.html#cards"><span class="sg-ic">📚</span><span class="sg-txt">經文卡冊</span>›</a>
          <a class="sg-item" href="me.html#badges"><span class="sg-ic">🏅</span><span class="sg-txt">徽章</span>›</a>
          <a class="sg-item" href="me.html#gifts"><span class="sg-ic">🎁</span><span class="sg-txt">收到的禮物</span>›</a>
          <a class="sg-item" href="me.html#profile"><span class="sg-ic">👤</span><span class="sg-txt">我的資料</span>›</a></section>
      </section>
    </div>
  </main>

  <script src="js/sg-frame.js?v=20261116w"></script>
  <script src="js/sg-books.js?v=20261116w"></script>
  <script src="js/sg-land.js?v=20261116w"></script>
